<rect x="580" y="600" width="410" height="230" rx="12" fill="#ffffff" stroke="#cbdfd5" stroke-width="1.5"/>
<text x="108" y="625" class="small" text-anchor="start">PRIVATE A · 10.20.11.0/24</text>
<text x="598" y="625" class="small" text-anchor="start">PRIVATE B · 10.20.12.0/24</text>
<rect x="110" y="650" width="860" height="120" rx="14" fill="none" stroke="#8a9baf" stroke-width="1.5" stroke-dasharray="7 5"/>
