<text x="295" y="705" class="node" text-anchor="middle">Nginx / EC2 Arm64</text>
<text x="295" y="730" class="small" text-anchor="middle">Private IP · instance role · SSM</text>
<text x="785" y="705" class="node" text-anchor="middle">Nginx / EC2 Arm64</text>
<text x="785" y="730" class="small" text-anchor="middle">Private IP · instance role · SSM</text>
<text x="540" y="797" class="label" text-anchor="middle">Auto Scaling group · desired 2 · ELB health checks</text>
<path d="M425 510 V580 H295 V675" class="flow"/>
<path d="M650 510 V580 H785 V675" class="flow"/>
<path d="M135 710 H105 V585 H215 V553" class="egress"/>
<path d="M785 745 V850 H105 V585 H215 V553" class="egress"/>
<path d="M110 534 H55 V238 H420" class="egress"/>
<text x="540" y="876" class="small" text-anchor="middle">Both private subnets share outbound connectivity through NAT in AZ A</text>
<text x="65" y="920" class="label" text-anchor="start">Availability boundary: application spans two AZs; egress depends on one NAT AZ.</text>
<rect x="1080" y="300" width="280" height="650" rx="16" fill="#f8f9fc" stroke="#ccd6e3" stroke-width="1.5"/>
<text x="1100" y="333" class="label" text-anchor="start">OPERATIONS &amp; AUDIT</text>
<rect x="1100" y="405" width="240" height="115" rx="12" fill="#ffffff" stroke="#b7c9dd" stroke-width="1.5"/>
