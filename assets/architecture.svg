<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">Resilient AWS CloudOps Web Service</title>
<desc id="desc">Public HTTP clients enter an ALB across two public subnets. The ALB sends requests to two private Nginx instances in an Auto Scaling group across two AZs. Both private subnets share one NAT gateway. CloudWatch, SNS, CloudTrail, Config, and S3 provide operational and audit evidence.</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2864a6"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#178176"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#76859a"/></marker></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b46}.heading{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#566780}.label{font-size:14px;fill:#566780}.node{font-size:18px;font-weight:650}.small{font-size:13px;fill:#566780}.flow{fill:none;stroke:#2864a6;stroke-width:2.6;marker-end:url(#blue)}.egress{fill:none;stroke:#178176;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#teal)}.telemetry{fill:none;stroke:#76859a;stroke-width:2;stroke-dasharray:3 5;marker-end:url(#gray)}</style>
<rect width="1400" height="1050" fill="#ffffff"/>
<text x="50" y="53" class="heading" text-anchor="start">Resilient AWS CloudOps Web Service</text>
<text x="50" y="84" class="sub" text-anchor="start">Console implementation · private compute · measured application recovery</text>
<rect x="400" y="120" width="330" height="70" rx="12" fill="#f3f7fc" stroke="#a9bfdc" stroke-width="1.5"/>
<text x="565" y="150" class="node" text-anchor="middle">External HTTP client</text>
<text x="565" y="173" class="small" text-anchor="middle">Synthetic page and health requests</text>
<rect x="420" y="210" width="290" height="55" rx="12" fill="#f6f8fb" stroke="#ccd6e3" stroke-width="1.5"/>
<text x="565" y="244" class="node" text-anchor="middle">Internet gateway</text>
<path d="M565 190 V210" class="flow"/>
<rect x="40" y="300" width="1000" height="650" rx="16" fill="#fafcfe" stroke="#94abc6" stroke-width="1.5"/>
<text x="65" y="332" class="node" text-anchor="start">us-east-1 · dg-p1-vpc · 10.20.0.0/16</text>
<rect x="70" y="350" width="450" height="540" rx="12" fill="#f1f6fc" stroke="#d1dce9" stroke-width="1.5"/>
<rect x="560" y="350" width="450" height="540" rx="12" fill="#f1f8f6" stroke="#d0e3dc" stroke-width="1.5"/>
<text x="92" y="382" class="node" text-anchor="start">Availability Zone A · us-east-1a</text>
<text x="582" y="382" class="node" text-anchor="start">Availability Zone B · us-east-1b</text>
<rect x="90" y="405" width="410" height="160" rx="12" fill="#ffffff" stroke="#d4dfeb" stroke-width="1.5"/>
<rect x="580" y="405" width="410" height="160" rx="12" fill="#ffffff" stroke="#d2e3dc" stroke-width="1.5"/>
<text x="107" y="427" class="small" text-anchor="start">PUBLIC A · 10.20.1.0/24</text>
<text x="757" y="427" class="small" text-anchor="middle">PUBLIC B · 10.20.2.0/24</text>
<rect x="350" y="445" width="360" height="65" rx="12" fill="#e9f1fb" stroke="#7e9fc7" stroke-width="1.5"/>
<text x="530" y="473" class="node" text-anchor="middle">Application Load Balancer</text>
<text x="530" y="495" class="small" text-anchor="middle">HTTP :80 · both public subnets</text>
