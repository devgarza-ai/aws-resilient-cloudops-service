<text x="1220" y="764" class="small" text-anchor="middle">API audit / rule evaluations</text>
<text x="1220" y="787" class="small" text-anchor="middle">Management and config evidence</text>
<rect x="1100" y="850" width="240" height="55" rx="12" fill="#ffffff" stroke="#c2b7d6" stroke-width="1.5"/>
<text x="1220" y="883" class="label" text-anchor="middle">Dedicated S3 buckets</text>
<path d="M1220 805 V850" class="telemetry"/>
<path d="M60 1002 H115" class="flow"/>
